---
### Blinds ###

# Template behavior for the blinds motors across the house: minimize
# afternoon sun glare and improve energy efficiency by not opening the
# blinds when it is too cold.

# Four primary automations:
# - Morning (Open)
# - Afternoon (Close)
# - Sunset (Open)
# - Bedtime (Close)

# All blinds are grouped so coverage continues as more motors are
# installed; western-facing areas may eventually get per-area sets.

cover:
  - name: Blinds
    platform: group
    entities:
      - cover.office_blinds

# Centralized check for opening the blinds.
input_boolean:
  blinds_lock:
    name: Blinds Lock

# Dynamic icon
homeassistant:
  customize:
    input_boolean.blinds_lock:
      templates:
        icon: >
          if (state === 'on') return 'mdi:lock';
          return 'mdi:lock-open';

automation:
  ################################################################################
  - id: project_blinds_lock
    alias: Project - Blinds - Lock
    triggers:
      - trigger: state
        entity_id: input_boolean.away_mode
      - trigger: numeric_state
        entity_id: sensor.back_yard_weather_station_temperature
        above: 0
      - trigger: numeric_state
        entity_id: sensor.back_yard_weather_station_temperature
        below: 0
    actions:
      - alias: 'State Handler'
        choose:
          - conditions:
              - condition: and
                conditions:
                  - alias: 'Above Freezing'
                    condition: numeric_state
                    entity_id: sensor.back_yard_weather_station_temperature
                    above: 0
                  - alias: 'Someone is home'
                    condition: state
                    entity_id: input_boolean.away_mode
                    state: 'off'
                  - alias: 'Alarm is disarmed'
                    condition: state
                    entity_id: alarm_control_panel.home
                    state: 'disarmed'
            sequence:
              - alias: 'Disable Lock'
                action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.blinds_lock
          - conditions:
              - condition: or
                conditions:
                  - alias: 'Below Freezing'
                    condition: numeric_state
                    entity_id: sensor.back_yard_weather_station_temperature
                    below: 0
                  - alias: 'Nobody is home'
                    condition: state
                    entity_id: input_boolean.away_mode
                    state: 'on'
                  - alias: 'Alarm is armed'
                    condition: state
                    entity_id: alarm_control_panel.home
                    state: 'armed'
            sequence:
              - alias: 'Enable Lock'
                action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.blinds_lock
  ################################################################################
  - id: project_blinds_morning
    alias: Project - Blinds - Morning
    triggers:
      - trigger: sun
        event: sunrise
    conditions:
      - alias: 'Blinds Unlocked'
        condition: state
        entity_id: input_boolean.blinds_lock
        state: 'off'
    actions:
      - alias: 'Morning - Open'
        action: cover.set_cover_position
        target:
          entity_id: cover.blinds
        data:
          position: 100
  ################################################################################
  - id: project_blinds_afternoon
    alias: Project - Blinds - Afternoon
    triggers:
      - trigger: numeric_state
        entity_id: sun.sun
        value_template: >
          "{{ state.attributes.azimuth }}"
        # Azimuth where the sun hits the home's western face.
        above: 150
    actions:
      - alias: 'Afternoon - Close'
        action: cover.set_cover_position
        target:
          entity_id: cover.blinds
        data:
          position: 0
  ################################################################################
  - id: project_blinds_sunset
    alias: Project - Blinds - Sunset
    triggers:
      - trigger: sun
        event: sunset
        # 5 Minutes before. Enjoy the sunset.
        offset: '-00:05:00'
    conditions:
      - alias: 'Blinds Unlocked'
        condition: state
        entity_id: input_boolean.blinds_lock
        state: 'off'
    actions:
      - alias: 'Sunset - Open'
        action: cover.set_cover_position
        target:
          entity_id: cover.blinds
        data:
          position: 100
  ################################################################################
  - id: project_blinds_night
    alias: Project - Blinds - Night
    triggers:
      # Close blinds at night
      - trigger: time
        at: '23:00:00'
    actions:
      - alias: 'Night - Close'
        action: cover.set_cover_position
        target:
          entity_id: cover.blinds
        data:
          position: 0
  ################################################################################
  - id: project_blinds_close
    alias: Project - Blinds - Away
    triggers:
      # Close blinds when alarm is armed
      - trigger: state
        entity_id: alarm_control_panel.home
        from: 'disarmed'
        to: 'armed'
      # Close blinds when the house is empty
      - trigger: state
        entity_id: input_boolean.away_mode
        from: 'off'
        to: 'on'
    actions:
      - alias: 'Blinds Close'
        action: cover.set_cover_position
        target:
          entity_id: cover.blinds
        data:
          position: 0
################################################################################
