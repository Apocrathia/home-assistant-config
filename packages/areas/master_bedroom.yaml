---
### Master Bedroom ###

# Inputs
input_number:
  master_bedroom_humidifer_threshold:
    name: 'Master Bedroom Humidier Threshold'
    min: 0
    max: 100
    step: 10
  # Bed-presence debounce windows (sensor-noise design 2026-09-21).
  # settle: raw ON must hold this long before "really in bed".
  # exit: raw OFF must hold this long before "really out of bed" - the
  # longest observed mid-night departure is 18 min, so 30 min never
  # breaks sleep. Tuning these live retunes the stable wrapper below.
  master_bedroom_bed_settle_minutes:
    name: 'Bed Presence Settle Minutes'
    icon: mdi:bed
    min: 5
    max: 30
    step: 1
    initial: 10
    unit_of_measurement: min
  master_bedroom_bed_exit_minutes:
    name: 'Bed Presence Exit Minutes'
    icon: mdi:bed-empty
    min: 10
    max: 60
    step: 5
    initial: 30
    unit_of_measurement: min

# Template Sensors
template:
  - binary_sensor:
      - default_entity_id: binary_sensor.master_bedroom_humidifer_low
        name: Master Bedroom Humidier Low
        state: >
          {{ ( float(states('sensor.master_bedroom_humidifier_water_level')) <
            float(states('input_number.master_bedroom_humidifer_threshold')) ) }}
      # Sleep-grade bed occupancy: debounced view of the raw ESPHome
      # either-bed sensor. The raw sensor stays untouched for instant
      # consumers (night lights, good morning, alarm clock) - future
      # sleep-mode logic keys this stable entity instead.
      - name: Master Bedroom Bed Occupied Stable
        unique_id: master_bedroom_bed_occupied_stable
        device_class: occupancy
        state: >
          {{ is_state('binary_sensor.bed_presence_2bd444_bed_occupied_either', 'on') }}
        # delay_on/off take a top-level template that must render a time
        # period; render "HH:MM:SS" (a bare number would mean seconds).
        # Bedtime settle: raw must hold ON this long before "really in bed".
        delay_on: >
          {{ "00:%02d:00" | format(
            states('input_number.master_bedroom_bed_settle_minutes') | int(10)
          ) }}
        # Bathroom trips (observed 1-18 min) must not break sleep; morning
        # exit is declared this long after sustained vacancy.
        delay_off: >
          {{ "00:%02d:00" | format(
            states('input_number.master_bedroom_bed_exit_minutes') | int(30)
          ) }}

# Alerts
alert:
  master_bedroom_humidifer_low:
    name: Master Bedroom Humidier Low
    entity_id: binary_sensor.master_bedroom_humidifer_low
    message: 'Go refil the master bedroom humidifier'
    done_message: 'Was that so hard?'
    state: 'on'
    repeat: 120
    can_acknowledge: true
    notifiers:
      - ians_iphone
      - mobile_app_iphone

# Automations
automation:
  ################################################################################
  - id: area_master_bedroom_bed_sensor_night_lights
    alias: Area - Master Bedroom - Bed Sensor Night Lights
    description: Turn on under-bed lights when getting out of bed at night
    triggers:
      - trigger: state
        entity_id: binary_sensor.bed_presence_2bd444_bed_occupied_either
    conditions:
      - alias: 'Sun is down (night time)'
        condition: sun
        after: sunset
        before: sunrise
    actions:
      - alias: 'Status handler'
        choose:
          - conditions:
              - alias: 'Got out of bed'
                condition: state
                entity_id: binary_sensor.bed_presence_2bd444_bed_occupied_either
                state: 'off'
            sequence:
              - alias: 'Turn on under-bed safety lights'
                action: switch.turn_on
                target:
                  entity_id: switch.ians_bed_safety_lights
          - conditions:
              - alias: 'Got back in bed'
                condition: state
                entity_id: binary_sensor.bed_presence_2bd444_bed_occupied_either
                state: 'on'
            sequence:
              - alias: 'Turn off under-bed safety lights'
                action: switch.turn_off
                target:
                  entity_id: switch.ians_bed_safety_lights
  ################################################################################
  - id: area_master_bedroom_closet_motion
    alias: Area - Master Bedroom - Closet Motion
    triggers:
      - trigger: state
        entity_id: binary_sensor.master_bedroom_closet_motion_occupancy
    conditions:
      - alias: 'House is occupied'
        condition: state
        entity_id: group.people
        state: 'home'
    actions:
      - alias: 'Status handler'
        choose:
          - conditions:
              - alias: 'Motion detected'
                condition: state
                entity_id: binary_sensor.master_bedroom_closet_motion_occupancy
                state: 'on'
            sequence:
              - alias: 'Turn on closet light'
                action: light.turn_on
                target:
                  entity_id: light.master_bedroom_closet_light
          - conditions:
              - alias: 'Motion cleared'
                condition: state
                entity_id: binary_sensor.master_bedroom_closet_motion_occupancy
                state: 'off'
            sequence:
              - alias: 'Turn off closet light'
                action: light.turn_off
                target:
                  entity_id: light.master_bedroom_closet_light
  ################################################################################
  - id: area_master_bedroom_panic_button
    alias: Area - Master Bedroom - Panic Button
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          unique_id: !secret panic_button_unique_id
          args:
            attribute_name: on_off
            # Upon release
            value: 1
    # condition:
    actions:
      # - alias: "Test"
      #   action: notify.alexa_media
      #   data:
      #     data:
      #       type: tts
      #     target:
      #       - media_player.downstairs_thermostat
      #       - media_player.upstairs_thermostat
      #     message: 'The button was pressed.'
      - alias: 'Sound the alarm'
        action: alarm_control_panel.alarm_trigger
        data:
          entity_id: alarm_control_panel.home
          code: !secret alarm_code
  ################################################################################
  - id: area_master_bedroom_bedjet_preconditioning
    alias: Area - Master Bedroom - BedJet Preconditioning
    triggers:
      - trigger: time
        at: input_datetime.bedtime
    conditions:
      - alias: 'House is occupied'
        condition: state
        entity_id: group.people
        state: 'home'
    actions:
      - alias: 'Get overnight low temperature'
        action: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.pirate_weather
        response_variable: forecast_data
      - alias: 'Extract overnight low temperature'
        variables:
          overnight_low: >
            {{ forecast_data['weather.pirate_weather'].forecast[0].templow | float }}
      - alias: 'Set BedJet based on conditions'
        choose:
          - conditions:
              - alias: 'Very cold night - extended heat'
                condition: template
                value_template: '{{ overnight_low < 0 }}'
            sequence:
              - alias: 'Set extended heat preset'
                action: climate.set_preset_mode
                target:
                  entity_id: climate.ians_bedjet
                data:
                  preset_mode: Extended Heat
          - conditions:
              - alias: 'Cold night - pre-heat the bed'
                condition: template
                value_template: '{{ overnight_low < 10 }}'
            sequence:
              - alias: 'Heat the bed to 25°C'
                action: climate.set_temperature
                target:
                  entity_id: climate.ians_bedjet
                data:
                  temperature: 25
                  hvac_mode: heat
          - conditions:
              - alias: 'Warm night - pre-cool the bed'
                condition: template
                value_template: '{{ overnight_low > 25 }}'
            sequence:
              - alias: 'Cool the bed to 15°C'
                action: climate.set_temperature
                target:
                  entity_id: climate.ians_bedjet
                data:
                  temperature: 15
                  hvac_mode: cool
          - conditions:
              - alias: 'Room is warm but moderate night - just use fan'
                condition: numeric_state
                entity_id: sensor.ians_bedjet_ambient_temperature
                above: 25
            sequence:
              - alias: 'Turn on BedJet fan'
                action: fan.turn_on
                target:
                  entity_id: fan.ians_bedjet
        default:
          - alias: 'Moderate temperature - turn off BedJet'
            action: climate.turn_off
            target:
              entity_id: climate.ians_bedjet
################################################################################
