---
### Kitchen ###
alert:
  ################################################################################
  kitchen_dishwasher_complete:
    name: Kitchen Dishwasher Complete
    message: >
      {% set state = states.sensor.dishwasher_state.state %}
      {% if state == 'finished' %}
        Dishwasher cycle complete.
      {% elif state == 'clean' %}
        Dishwasher finished. Open door to remove dishes.
      {% elif state == 'ending' %}
        Dishwasher cycle nearly done.
      {% else %}
        Dishwasher: {{ state }}
      {% endif %}
    done_message: 'Dishwasher running.'
    entity_id: sensor.dishwasher_state
    state: 'alert'
    repeat:
      - 15
      - 30
      - 60
    can_acknowledge: true
    skip_first: false
    notifiers:
      - mobile_app_ians_iphone
      - mobile_app_ians_ipad_pro
    data:
      tag: kitchen-dishwasher-complete
      group: kitchen-appliances
      push:
        interruption-level: active
################################################################################

automation:
  ################################################################################
  - id: area_kitchen_pantry_light
    alias: 'Area - Kitchen - Pantry Light'
    trigger:
      - platform: state
        entity_id: binary_sensor.kitchen_pantry_door_contact
    action:
      - alias: 'State Handler'
        choose:
          - conditions:
              - alias: 'Door is open'
                condition: state
                entity_id: binary_sensor.kitchen_pantry_door_contact
                state: 'on'
            sequence:
              service: light.turn_on
              data:
                entity_id: light.kitchen_pantry_light
                transition: 3
                brightness_pct: 100
          - conditions:
              - alias: 'Door is closed'
                condition: state
                entity_id: binary_sensor.kitchen_pantry_door_contact
                state: 'off'
            sequence:
              service: light.turn_off
              data:
                entity_id: light.kitchen_pantry_light
                transition: 1
################################################################################
