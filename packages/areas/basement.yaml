automation:
  ################################################################################
  - id: area_basement_leak_detected
    alias: 'Area - Basement - Leak Detected'
    triggers:
      - trigger: event
        event_type: ios.notification_action_fired
        event_data:
          categoryName: area_basement_leak_detected
    actions:
      # Alert entity alert.area_basement_leak_detected does not exist
      # This automation will not function until the alert is configured
      choose:
        - conditions: >
            "{{ trigger.event.data.actionName == "ACKNOWLEDGE_LEAK" }}"
          sequence: []
        - conditions: >
            "{{ trigger.event.data.actionName == "IGNORE_LEAK" }}"
          sequence: []
################################################################################
