---
################################################################################
# Awtrix (Ulanzi TC001 / Awtrix3) Integration – House-Wide Pixel Clocks
################################################################################
# Devices: Ulanzi TC001 Smart Pixel Clocks, firmware Awtrix3, connected via MQTT.
# HA integration: ha-awtrix (https://github.com/MiguelAngelLV/ha-awtrix)
# Awtrix3 API: https://blueforcer.github.io/awtrix3/
#
# Device registry (HA device IDs, used by the awtrix.* services):
#   039ec645765634d11bba9ae96840a922  Living Room Clock    (mqtt 140808720dbc)
#   ef32274bca923d98274c073f0df1b7ac  Garage Clock         (mqtt d4e9f4cef85c)
#   3344753e4f1e7a6fbacb3b7c700b14ca  Dining Room Clock    (mqtt 20e7c82dd9dc)
#   e01ad3a982951bafca7f2712681fa6b0  Master Bedroom Clock (mqtt 9451dc967618)
#
# House-wide apps and notifications fan out through the broadcast scripts below.
# Device-local behavior (brightness, room climate) stays pinned to its device.
#
# Icons: LaMetric numeric IDs. Download via the Awtrix built-in web interface by entering each icon id.
#   Climate: 2056 (temperature), 3359 (humidity)
#   Weather: 2282 (clear), 2284 (rain), 2289 (snow), 2283 (cloudy), 2158 (fog), 11428 (thunderstorm)
#   Notifications: 18576 (trash can), 2314 (moon / clear night)
#   Other: 2282 (sun), 27464 (solar)
################################################################################

# ============================
# Scripts — broadcast helpers
# ============================
script:
  awtrix_broadcast_custom_app:
    alias: 'Awtrix - Broadcast Custom App'
    description: 'Push (or refresh) a custom app on every Awtrix clock in the house.'
    icon: 'mdi:clock-digital'
    mode: parallel
    max: 10
    fields:
      app:
        description: 'Custom app slot name (stable identifier on the device).'
        required: true
      text:
        description: 'Text to display.'
        required: true
      icon:
        description: 'LaMetric icon ID.'
        required: false
      color:
        description: 'Text color as hex (default #FFFFFF).'
        required: false
      duration:
        description: 'Seconds the app is shown per rotation (default 5).'
        required: false
    variables:
      awtrix_devices:
        - '039ec645765634d11bba9ae96840a922' # Living Room Clock
        - 'ef32274bca923d98274c073f0df1b7ac' # Garage Clock
        - '3344753e4f1e7a6fbacb3b7c700b14ca' # Dining Room Clock
        - 'e01ad3a982951bafca7f2712681fa6b0' # Master Bedroom Clock
    sequence:
      - repeat:
          for_each: '{{ awtrix_devices }}'
          sequence:
            - service: awtrix.custom_app
              data:
                device: '{{ repeat.item }}'
                app: '{{ app }}'
                text: '{{ text }}'
                icon: "{{ icon | default('') }}"
                duration: '{{ duration | default(5) }}'
                color: "{{ color | default('#FFFFFF') }}"

  awtrix_broadcast_notification:
    alias: 'Awtrix - Broadcast Notification'
    description: 'Send a one-shot notification to every Awtrix clock in the house.'
    icon: 'mdi:bell-ring'
    mode: parallel
    max: 10
    fields:
      text:
        description: 'Notification text.'
        required: true
      icon:
        description: 'LaMetric icon ID.'
        required: false
      duration:
        description: 'Seconds the notification is shown (default 10).'
        required: false
      sound:
        description: 'Built-in sound name (mutually exclusive with rtttl).'
        required: false
      rtttl:
        description: 'RTTTL melody string (mutually exclusive with sound).'
        required: false
      rainbow:
        description: 'Rainbow text effect (default false).'
        required: false
      stack:
        description: 'Stack behind other notifications (default false).'
        required: false
    variables:
      awtrix_devices:
        - '039ec645765634d11bba9ae96840a922' # Living Room Clock
        - 'ef32274bca923d98274c073f0df1b7ac' # Garage Clock
        - '3344753e4f1e7a6fbacb3b7c700b14ca' # Dining Room Clock
        - 'e01ad3a982951bafca7f2712681fa6b0' # Master Bedroom Clock
    sequence:
      - repeat:
          for_each: '{{ awtrix_devices }}'
          sequence:
            # Sound and rtttl payload keys can't be sent empty, so branch on
            # which (if either) was provided.
            - choose:
                - conditions: "{{ sound | default('') != '' }}"
                  sequence:
                    - service: awtrix.notification
                      data:
                        device: '{{ repeat.item }}'
                        text: '{{ text }}'
                        icon: "{{ icon | default('') }}"
                        duration: '{{ duration | default(10) }}'
                        sound: '{{ sound }}'
                        rainbow: '{{ rainbow | default(false) }}'
                        stack: '{{ stack | default(false) }}'
                - conditions: "{{ rtttl | default('') != '' }}"
                  sequence:
                    - service: awtrix.notification
                      data:
                        device: '{{ repeat.item }}'
                        text: '{{ text }}'
                        icon: "{{ icon | default('') }}"
                        duration: '{{ duration | default(10) }}'
                        rtttl: '{{ rtttl }}'
                        rainbow: '{{ rainbow | default(false) }}'
                        stack: '{{ stack | default(false) }}'
              default:
                - service: awtrix.notification
                  data:
                    device: '{{ repeat.item }}'
                    text: '{{ text }}'
                    icon: "{{ icon | default('') }}"
                    duration: '{{ duration | default(10) }}'
                    rainbow: '{{ rainbow | default(false) }}'
                    stack: '{{ stack | default(false) }}'

# ============================
# Automations
# ============================
automation:
  ################################################################################
  # Device-local: Living Room Clock brightness (driven by its own light sensor)
  ################################################################################
  - id: integration_awtrix_living_room_brightness
    alias: 'Integration - Awtrix - Living Room Clock Brightness'
    description: 'Set the brightness of the Living Room Clock.'
    trigger:
      - platform: state
        entity_id:
          - sensor.living_room_clock_illuminance
          - sensor.time
          - sensor.morning_start
          - sensor.nighttime_start
      - platform: homeassistant
        event: start
    action:
      - alias: 'Calculate brightness'
        variables:
          raw: '{{ states.sensor.living_room_clock_illuminance.state | int(0) }}'
          awake: '{{ states.sensor.time.state >= states.sensor.morning_start.state and states.sensor.time.state < states.sensor.nighttime_start.state }}'
          brightness: "{{ [0, [255, (raw | int + (1 if awake | lower == 'true' else 0))] | min] | max }}"
      - service: awtrix.settings
        data:
          device: '039ec645765634d11bba9ae96840a922'
          BRI: '{{ brightness }}'

  ################################################################################
  # Device-local: Living room temp and humidity (Downstairs Air Quality Sensor)
  # Two pages: temp then humidity. Color is dynamic (temp: cold/comfort/hot;
  # humidity: low/ok/high).
  ################################################################################
  - id: integration_awtrix_living_room_climate
    alias: 'Integration - Awtrix - Living Room Climate Custom App'
    description: 'Push living room temp and humidity to the Living Room Clock (downstairs air quality sensor).'
    trigger:
      - platform: state
        entity_id:
          - sensor.downstairs_air_quality_sensor_temperature
          - sensor.downstairs_air_quality_sensor_humidity
      - platform: homeassistant
        event: start
    action:
      - service: awtrix.custom_app
        data:
          device: '039ec645765634d11bba9ae96840a922'
          app: 'climate_temp'
          text: "{{ states('sensor.downstairs_air_quality_sensor_temperature') | float | round(1) }}°C"
          duration: 3
          icon: '2056' # temperature
          color: "{% set t = states('sensor.downstairs_air_quality_sensor_temperature') | float(20) %}{% if t < 17 %}#00BFFF{% elif t > 26 %}#FF4500{% else %}#00FF7F{% endif %}"
      - service: awtrix.custom_app
        data:
          device: '039ec645765634d11bba9ae96840a922'
          app: 'climate_humidity'
          text: "{{ states('sensor.downstairs_air_quality_sensor_humidity') | float | round(0) }}%"
          duration: 3
          icon: '3359' # humidity
          color: "{% set h = states('sensor.downstairs_air_quality_sensor_humidity') | float(35) %}{% if h < 20 %}#FFA500{% elif h > 45 %}#1E90FF{% else %}#00FF7F{% endif %}"

  ################################################################################
  # House-wide app: Outdoor conditions (local Tempest readings and cloud summary)
  ################################################################################
  - id: integration_awtrix_outdoor_weather
    alias: 'Integration - Awtrix - Outdoor Weather Custom App'
    description: 'Push local outdoor temperature and humidity with cloud weather condition to all Awtrix clocks.'
    trigger:
      - platform: state
        entity_id:
          - sensor.back_yard_weather_station_temperature
          - sensor.back_yard_weather_station_humidity
          - sensor.pirate_weather_summary
      - platform: homeassistant
        event: start
    action:
      - service: script.awtrix_broadcast_custom_app
        data:
          app: 'Outdoor'
          text: "{{ states('sensor.back_yard_weather_station_temperature') | float | round(1) }}°C  {{ states('sensor.back_yard_weather_station_humidity') | float | round(0) }}%  {{ states('sensor.pirate_weather_summary') }}"
          duration: 3
          # 2282=clear, 2284=rain, 2289=snow, 2283=cloudy, 2158=fog, 11428=thunderstorm
          icon: "{% set s = states('sensor.pirate_weather_summary') | lower %}{% if 'rain' in s or 'drizzle' in s %}2284{% elif 'snow' in s %}2289{% elif 'thunder' in s or 'storm' in s %}11428{% elif 'fog' in s or 'mist' in s %}2158{% elif 'cloud' in s or 'overcast' in s %}2283{% else %}2282{% endif %}"
          color: "{% set t = states('sensor.back_yard_weather_station_temperature') | float(20) %}{% if t < 5 %}#00BFFF{% elif t > 30 %}#FF4500{% else %}#00FF7F{% endif %}"

  ################################################################################
  # House-wide app: solar (Solaredge)
  # GetLiveContext shows no sensor.solaredge_energy_today; using sensor.solaredge_dc_power (current W).
  # If you add Solaredge API site sensors, sensor.solaredge_energy_today can be used for "kWh today".
  ################################################################################
  - id: integration_awtrix_solar_power
    alias: 'Integration - Awtrix - Solar Power Custom App'
    description: 'Show solar current power on all Awtrix clocks.'
    trigger:
      - platform: state
        entity_id: sensor.solaredge_dc_power
      - platform: homeassistant
        event: start
    action:
      - service: script.awtrix_broadcast_custom_app
        data:
          app: 'Solar'
          text: "{{ states('sensor.solaredge_dc_power') | float(0) | round(0) }} W"
          duration: 5
          icon: '27464' # solar
          color: '#FFFFFF'

  ################################################################################
  # House-wide notification: trash reminder (Tuesday night and Wednesday morning)
  ################################################################################
  - id: integration_awtrix_notification_trash
    alias: 'Integration - Awtrix - Trash Pickup Reminder'
    description: 'Display trash reminder on all Awtrix clocks.'
    trigger:
      - platform: template # Tuesday Night
        value_template: >
          {{
            (now().weekday() == 1) and
            (now().time().hour == 19) and
            (now().time().minute == 0)
          }}
      - platform: template # Wednesday Morning
        value_template: >
          {{
            (now().weekday() == 2) and
            (now().time().hour == 7) and
            (now().time().minute == 0)
          }}
    action:
      - service: script.awtrix_broadcast_notification
        data:
          text: 'Pull the trash bin to the curb!'
          duration: 10
          icon: '18576' # trash can
          sound: 'alert'
          stack: false
          rainbow: true

  ################################################################################
  # House-wide notification: last call reminder
  # sensor.time and sensor.last_call are both HH:MM strings. Convert to minutes
  # past midnight, fire at T-60 / T-30 / T-15 / T-5 / T-0, then announce remaining.
  ################################################################################
  - id: integration_awtrix_notification_last_call_reminder
    alias: 'Integration - Awtrix - Last Call Reminder'
    description: 'Show lights-out reminder on all Awtrix clocks ahead of last call.'
    trigger:
      - platform: template
        value_template: >
          {% set t = states('sensor.time').split(':') %}
          {% set lc = states('sensor.last_call').split(':') %}
          {% if t|length < 2 or lc|length < 2 %}
            false
          {% else %}
            {% set now_m = t[0]|int(0) * 60 + t[1]|int(0) %}
            {% set call_m = lc[0]|int(0) * 60 + lc[1]|int(0) %}
            {% set rem = (call_m - now_m) % 1440 %}
            {{ rem in [0, 5, 15, 30, 60] }}
          {% endif %}
    condition:
      - condition: state
        entity_id: binary_sensor.worknight
        state: 'on'
    action:
      - alias: 'Calculate time remaining'
        variables:
          time_remaining: >
            {% set t = states('sensor.time').split(':') %}
            {% set lc = states('sensor.last_call').split(':') %}
            {% set now_m = t[0]|int(0) * 60 + t[1]|int(0) %}
            {% set call_m = lc[0]|int(0) * 60 + lc[1]|int(0) %}
            {{ (call_m - now_m) % 1440 }}
          reminder_text: >
            {% if time_remaining | int(0) == 0 %}
              Lights out!
            {% else %}
              Lights out in {{ time_remaining }} minutes
            {% endif %}
      - service: script.awtrix_broadcast_notification
        data:
          text: '{{ reminder_text }}'
          duration: 30
          icon: '2314' # moon / clear night
          rtttl: 'two_short:d=4,o=5,b=100:16e6,16e6'
          stack: false
