---
# Matic Robot Vacuums

# Two Matic robot vacuums: vacuum.downstairs and vacuum.upstairs, provided by
# the matic_robot integration, a custom component bundled in
# custom_components/matic_robot (https://github.com/ProspectOre/matic-home-assistant).
#
# Vacuum entity surface:
#   - States: cleaning / returning / error / idle / docked / paused.
#   - Supported: start, pause, stop, return-to-base, room and area cleaning.
#     No fan speeds — cleaning intensity is the coverage select
#     (select.downstairs_coverage / select.upstairs_coverage).
#   - Battery is a separate sensor (sensor.downstairs_battery /
#     sensor.upstairs_battery), not a vacuum attribute.
#   - Live maps: camera.downstairs_map / camera.upstairs_map.

automation:
  ################################################################################
  # While home, dock any vacuum that starts cleaning — except on non-workdays
  # and the workday morning window (before 09:00). Short for: avoids fighting
  # location_home's clear-pending start → stop → dock sequence.
  - id: function_vacuum_quiet_hours
    alias: 'Function - Vacuum - Quiet Hours'
    triggers:
      - trigger: state
        entity_id:
          - vacuum.downstairs
          - vacuum.upstairs
        to: 'cleaning'
        for:
          minutes: 3
    conditions:
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
      - condition: not
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.workday
                state: 'off'
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.workday
                    state: 'on'
                  - condition: time
                    before: '09:00:00'
    actions:
      # Stop first. Matic's stop also sends the robot home; the dock call
      # after the delay makes sure the robot is back on its dock.
      - action: vacuum.stop
        data:
          entity_id: '{{ trigger.entity_id }}'
      - delay: 00:00:05
      - action: vacuum.return_to_base
        data:
          entity_id: '{{ trigger.entity_id }}'
################################################################################
