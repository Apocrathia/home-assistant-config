---
### Doge ###
# Breakfast and dinner meal reminders (lunch removed).
# Template sensors compute feed / advance / end / relief clock times from helpers.

### Inputs ###
input_datetime:
  doge_meal_breakfast:
    name: Doge - Breakfast
    has_date: false
    has_time: true
  doge_meal_dinner:
    name: Doge - Dinner
    has_date: false
    has_time: true

input_number:
  doge_meal_advance:
    name: Doge - Meal - Advance
    icon: mdi:clock-in
    min: 0
    max: 60
    step: 5
    unit_of_measurement: Minutes
  doge_meal_duration:
    name: Doge - Meal - Duration
    icon: mdi:clock-outline
    min: 0
    max: 60
    step: 5
    unit_of_measurement: Minutes
  doge_meal_relief:
    name: Doge - Meal - Relief
    icon: mdi:clock-out
    min: 0
    max: 6
    step: 1
    unit_of_measurement: Hours

### Sensors ###
template:
  - sensor:
      - default_entity_id: sensor.doge_meal_breakfast
        name: Doge - Meal - Breakfast
        state: >
          {{ (states.input_datetime.doge_meal_breakfast.attributes.timestamp |
              int | timestamp_custom("%H:%M", false)) }}
      - default_entity_id: sensor.doge_meal_breakfast_advance
        name: Doge - Meal - Breakfast (Advance)
        state: >
          {{ ((states.input_datetime.doge_meal_breakfast.attributes.timestamp |
              int - states.input_number.doge_meal_advance.state |
              int * 60) | timestamp_custom("%H:%M", false)) }}
      - default_entity_id: sensor.doge_meal_breakfast_end
        name: Doge - Meal - Breakfast (End)
        state: >
          {{ ((states.input_datetime.doge_meal_breakfast.attributes.timestamp |
              int + states.input_number.doge_meal_duration.state |
              int * 60) | timestamp_custom("%H:%M", false)) }}
      - default_entity_id: sensor.doge_meal_breakfast_relief
        name: Doge - Meal - Breakfast (Relief)
        state: >
          {{ ((states.input_datetime.doge_meal_breakfast.attributes.timestamp |
              int + states.input_number.doge_meal_duration.state | int * 60 +
              states.input_number.doge_meal_relief.state | int * 60 * 60) |
              timestamp_custom("%H:%M", false)) }}
      - default_entity_id: sensor.doge_meal_dinner
        name: Doge - Meal - Dinner
        state: >
          {{ (states.input_datetime.doge_meal_dinner.attributes.timestamp |
              int | timestamp_custom("%H:%M", false)) }}
      - default_entity_id: sensor.doge_meal_dinner_advance
        name: Doge - Meal - Dinner (Advance)
        state: >
          {{ ((states.input_datetime.doge_meal_dinner.attributes.timestamp |
              int - states.input_number.doge_meal_advance.state |
              int * 60) | timestamp_custom("%H:%M", false)) }}
      - default_entity_id: sensor.doge_meal_dinner_end
        name: Doge - Meal - Dinner (End)
        state: >
          {{ ((states.input_datetime.doge_meal_dinner.attributes.timestamp |
              int + states.input_number.doge_meal_duration.state |
              int * 60) | timestamp_custom("%H:%M", false)) }}
      - default_entity_id: sensor.doge_meal_dinner_relief
        name: Doge - Meal - Dinner (Relief)
        state: >
          {{ ((states.input_datetime.doge_meal_dinner.attributes.timestamp |
              int + states.input_number.doge_meal_duration.state | int * 60 +
              states.input_number.doge_meal_relief.state | int * 60 * 60) |
              timestamp_custom("%H:%M", false)) }}

### Automations ###
automation:
  - id: routine_doge_meals
    alias: Routine - Doge - Meals
    description: >
      Notify for breakfast/dinner upcoming, feed, end, and relief times when home.
    mode: queued
    triggers:
      - trigger: template
        id: breakfast_upcoming
        value_template: >
          {{ states('sensor.time') == states('sensor.doge_meal_breakfast_advance') }}
      - trigger: template
        id: breakfast
        value_template: >
          {{ states('sensor.time') == states('sensor.doge_meal_breakfast') }}
      - trigger: template
        id: breakfast_end
        value_template: >
          {{ states('sensor.time') == states('sensor.doge_meal_breakfast_end') }}
      - trigger: template
        id: breakfast_relief
        value_template: >
          {{ states('sensor.time') == states('sensor.doge_meal_breakfast_relief') }}
      - trigger: template
        id: dinner_upcoming
        value_template: >
          {{ states('sensor.time') == states('sensor.doge_meal_dinner_advance') }}
      - trigger: template
        id: dinner
        value_template: >
          {{ states('sensor.time') == states('sensor.doge_meal_dinner') }}
      - trigger: template
        id: dinner_end
        value_template: >
          {{ states('sensor.time') == states('sensor.doge_meal_dinner_end') }}
      - trigger: template
        id: dinner_relief
        value_template: >
          {{ states('sensor.time') == states('sensor.doge_meal_dinner_relief') }}
    conditions:
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
    actions:
      - variables:
          meal: "{{ trigger.id.replace('_upcoming', '').replace('_relief', '').replace('_end', '') }}"
          phase: >
            {% if trigger.id.endswith('_upcoming') %}upcoming
            {% elif trigger.id.endswith('_relief') %}relief
            {% elif trigger.id.endswith('_end') %}end
            {% else %}feed{% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ phase == 'upcoming' }}"
            sequence:
              - action: notify.notify
                data:
                  title: "It's Almost {{ meal | title }} Time!"
                  message: Get ready to get up and go feed the doge!
          - conditions:
              - condition: template
                value_template: "{{ phase == 'end' }}"
            sequence:
              - action: notify.notify
                data:
                  title: '{{ meal | title }} Is Over!'
                  message: Time to pick up the doge's bowl!
          - conditions:
              - condition: template
                value_template: "{{ phase == 'relief' }}"
            sequence:
              - action: notify.notify
                data:
                  title: Take The Doge Out!
                  message: Time to empty the doge!
          - conditions:
              - condition: template
                value_template: "{{ phase == 'feed' }}"
            sequence:
              - action: notify.notify
                data:
                  title: "It's {{ meal | title }} Time!"
                  message: Get up and go feed the doge!
