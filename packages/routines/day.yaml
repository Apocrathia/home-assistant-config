---
### Daytime Routines ###

################################################################################
# Inputs
################################################################################
input_datetime:
  morning:
    name: Morning
    has_date: false
    has_time: true
    # initial: '05:00'

  good_morning_earliest:
    name: Good Morning Earliest
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true
    initial: '05:00:00'

input_number:
  morning_advance:
    name: Morning Advance
    icon: mdi:clock-in
    # initial: 60
    min: 0
    max: 120
    step: 15
    unit_of_measurement: Minutes

  daytime_lighting_transition:
    name: Day Time Lighting Transition
    icon: mdi:clock-in
    # initial: 15
    min: 0
    max: 30
    step: 5
    unit_of_measurement: Minutes

  good_morning_bed_empty_delay:
    name: Good Morning Bed Empty Delay
    icon: mdi:bed-empty
    initial: 5
    min: 1
    max: 30
    step: 1
    unit_of_measurement: Minutes

################################################################################

template:
  ################################################################################
  - sensor:
      - default_entity_id: sensor.morning
        name: Morning
        icon: mdi:clock-outline
        state: >
          {{ states.input_datetime.morning.attributes.timestamp |
              int | timestamp_custom("%H:%M",False) }}
      - default_entity_id: sensor.morning_start
        name: Morning Start
        icon: mdi:clock-outline
        state: >
          {{ (((states.input_datetime.morning.attributes.timestamp |
              int) - (states.input_number.morning_advance.state |
              int * 60)) | timestamp_custom("%H:%M",False)) }}
      - default_entity_id: sensor.daytime_lighting_transition
        name: Day Time Lighting Transition
        icon: mdi:transition-masked
        unit_of_measurement: 'Seconds'
        state: >
          {{ ((states.input_number.daytime_lighting_transition.state |
              int) * 60) }}
      - default_entity_id: sensor.next_sunrise
        name: Next Sunrise
        icon: mdi:weather-sunset-up
        state: >
          {{ (as_timestamp(states.sun.sun.attributes.next_dawn) |
              int | timestamp_custom("%H:%M", True)) }}
################################################################################
automation:
  ################################################################################
  - id: routine_day_outdoor_lights
    alias: 'Routine - Day - Outdoor Lights'
    triggers:
      - trigger: sun
        event: sunrise
    conditions:
      - condition: state
        entity_id: light.outdoor_lights
        state: 'on'
    actions:
      - action: light.turn_off
        data:
          entity_id: light.outdoor_lights
  ################################################################################
  - id: routine_day_morning_lights
    alias: 'Routine - Day - Morning Lights'
    triggers:
      - trigger: sun
        event: sunrise
    conditions:
      - condition: state
        entity_id: light.morning_lights
        state: 'on'
    actions:
      - action: light.turn_off
        data:
          entity_id: light.morning_lights
      - action: switch.turn_off
        data:
          entity_id: switch.ians_bed_safety_lights
  ################################################################################
  - id: routine_day_night_lights
    alias: 'Routine - Day - Night Lights'
    triggers:
      - trigger: sun
        event: sunrise
    conditions:
      - condition: state
        entity_id: light.night_lights
        state: 'on'
    actions:
      - action: light.turn_off
        data:
          entity_id: light.night_lights
  ################################################################################
  - id: routine_day_airgradient_displays_and_leds
    alias: 'Routine - Day - AirGradient Displays And LEDs'
    triggers:
      - trigger: sun
        event: sunrise
    actions:
      - action: switch.turn_off
        data:
          entity_id:
            - switch.downstairs_air_quality_sensor_display_blank_page
            - switch.upstairs_air_quality_sensor_display_blank_page
            - switch.master_bedroom_air_quality_display_blank_page
            - switch.office_air_quality_sensor_display_blank_page
      - action: light.turn_on
        data:
          entity_id:
            - light.downstairs_air_quality_sensor_led_strip
            - light.upstairs_air_quality_sensor_led_strip
            - light.master_bedroom_air_quality_led_strip
            - light.office_air_quality_sensor_led_strip
  ################################################################################
  - id: routine_day_good_morning_alarm
    alias: 'Routine - Day - Good Morning Alarm'
    description: Disarm a home-armed alarm when the Good Morning scene is activated
    triggers:
      - trigger: scene.activated
        target:
          entity_id: scene.routine_day_good_morning
    conditions:
      - condition: state
        entity_id: alarm_control_panel.home
        state: 'armed_home'
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: 'off'
    actions:
      - alias: 'Disarm the alarm'
        action: alarm_control_panel.alarm_disarm
        data:
          entity_id: alarm_control_panel.home
          code: !secret alarm_code
    mode: single
  ################################################################################
  - id: routine_day_good_morning_wake
    alias: 'Routine - Day - Good Morning Wake Detection'
    description: Activate Good Morning after weekend bed-exit and bedroom motion
    triggers:
      - trigger: state
        entity_id: binary_sensor.bed_presence_2bd444_bed_occupied_either
        from: 'on'
        to: 'off'
        for:
          minutes: >
            {{ states('input_number.good_morning_bed_empty_delay') | int(5) }}
      - trigger: state
        entity_id: binary_sensor.master_bedroom_motion
        from: 'off'
        to: 'on'
      - trigger: time
        at: input_datetime.good_morning_earliest
    conditions:
      - alias: 'Today is not a workday'
        condition: state
        entity_id: binary_sensor.workday
        state: 'off'
      - alias: 'Earliest wake time has passed'
        condition: template
        value_template: >
          {{ now().strftime('%H:%M:%S') >=
             states('input_datetime.good_morning_earliest') }}
      - alias: 'Bed has remained empty'
        condition: template
        value_template: >
          {% set bed =
             states.binary_sensor.bed_presence_2bd444_bed_occupied_either %}
          {{ bed.state == 'off' and
             (as_timestamp(now()) - as_timestamp(bed.last_changed)) >=
             (states('input_number.good_morning_bed_empty_delay') |
              float(5) * 60) }}
      - alias: 'Master bedroom motion was detected recently'
        condition: template
        value_template: >
          {% set motion = states.binary_sensor.master_bedroom_motion %}
          {{ motion.state in ['on', 'off'] and
             (as_timestamp(now()) - as_timestamp(motion.last_changed)) <= 600 }}
      - condition: state
        entity_id: alarm_control_panel.home
        state: 'armed_home'
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: 'off'
    actions:
      - alias: 'Activate Good Morning'
        action: scene.turn_on
        target:
          entity_id: scene.routine_day_good_morning
    mode: single
  ################################################################################

  # I realize this automation will be a little redundant, but it's just in case I
  # forget to turn shit off, or another automation fails.
  ################################################################################
  - id: routine_day_lighting_off
    alias: 'Routine - Day - Turn Off Lights After Sunrise'
    triggers:
      - trigger: sun
        event: sunrise
        offset: '01:00:00'
    actions:
      - action: light.turn_off
        data:
          entity_id:
            - light.indoor_lights
            - light.outdoor_lights
            - light.back_yard_string_lights
      - action: switch.turn_off
        data:
          entity_id: switch.ians_bed_safety_lights
################################################################################

################################################################################
# Scenes
################################################################################
scene:
  - name: Routine - Day - Good Morning
    id: routine_day_good_morning
    entities:
      # Living Areas
      light.living_room_ceiling_fan:
        state: 'on'

      # Hallways (moderate lighting for safety)
      light.downstairs_hallway_lights:
        state: 'on'
        brightness_pct: 50
      light.upstairs_hallway_lights:
        state: 'on'
        brightness_pct: 50

  - name: Routine - Day - Full Daylight
    id: routine_day_full_daylight
    entities:
      # Turn off all indoor lights to save energy during full daylight
      light.indoor_lights:
        state: 'off'
      light.outdoor_lights:
        state: 'off'
      light.back_yard_string_lights:
        state: 'off'
      light.foyer_chandelier:
        state: 'off'
################################################################################
