---
################################################################################
# Event Routines
################################################################################

# Automations for specific events and days.
# Ideas: green lights for St. Patrick's Day.

automation:
  ################################################################################
  - id: routine_events_game_night
    alias: 'Routine - Events - Game Night'
    triggers:
      - trigger: time
        at: '18:00:00'
    conditions:
      - condition: state
        entity_id: group.people
        state: home
      - condition: template
        # 4th Saturday of the month (day 22–28)
        value_template: >
          {{ now().isocalendar()[2] == 6
              and now().day >= 22
              and now().day <= 28 }}
    actions:
      # TODO: party-mode sound announcement. Candidate sound:
      # US-EN-Morgan-Freeman-Starting-Party-Mode.wav from the iOS app sounds
      # (https://github.com/home-assistant/iOS/tree/master/HomeAssistant/Sounds),
      # but notify.alexa_media cannot play local sound files.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.party_lights
      - delay:
          # 18:00–20:00 game night window
          minutes: 120
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.party_lights
################################################################################
