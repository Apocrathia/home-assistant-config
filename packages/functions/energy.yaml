### Energy ###
---
switch:
  - platform: group
    name: Energy - Heavy Consumers
    entities:
      - switch.dishwasher_outlet
      - switch.washing_machine_outlet

input_number:
  solar_threshold:
    name: Solar Threshold
    icon: mdi:solar
    min: 500
    max: 2500
    step: 100
    unit_of_measurement: W

template:
  - binary_sensor:
      - default_entity_id: binary_sensor.solar_production
        name: Solar Production
        state: >
          {% if states('sensor.solaredge_ac_power')|float >
                states('input_number.solar_threshold')|float %}
            on
          {% else %}
            off
          {% endif %}
      - default_entity_id: binary_sensor.energy_door_open_outside_comfort
        name: Energy - Door Open Outside Comfort
        delay_on:
          minutes: 10
        state: >
          {% set outside_temp = states('sensor.back_yard_weather_station_temperature') | float(none) %}
          {% set door_open = is_state('binary_sensor.front_door', 'open')
             or is_state('binary_sensor.back_door', 'open')
             or is_state('binary_sensor.garage_door', 'open') %}
          {{ outside_temp is not none and door_open and (outside_temp < 18 or outside_temp > 22) }}

alert:
  function_energy_door_open_outside_comfort:
    name: Energy - Door Open Outside Comfort
    message: >
      {% set outside_temp = states('sensor.back_yard_weather_station_temperature') | float(none) %}
      {% set doors = [] %}
      {% if is_state('binary_sensor.front_door', 'open') %}
        {% set doors = doors + ['front door'] %}
      {% endif %}
      {% if is_state('binary_sensor.back_door', 'open') %}
        {% set doors = doors + ['back door'] %}
      {% endif %}
      {% if is_state('binary_sensor.garage_door', 'open') %}
        {% set doors = doors + ['garage door'] %}
      {% endif %}
      {{ doors | join(', ') | title }} has been open for over 10 minutes while outside
      temperature is {{ outside_temp | round(1) }}C (comfort range 18-22C).
    done_message: clear_notification
    entity_id: binary_sensor.energy_door_open_outside_comfort
    state: 'on'
    repeat:
      - 15
      - 30
      - 60
    can_acknowledge: true
    skip_first: false
    notifiers:
      - mobile_app_ians_iphone
      - mobile_app_ians_ipad_pro
    data:
      tag: energy-door-open-outside-comfort
      group: energy
      push:
        interruption-level: active

automation:
  - id: function_energy_solar_production
    alias: Function - Energy - Solar Production
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.solar_production
    actions:
      - alias: Turn on outlets when solar is being produced
        action: >-
          {% if states('binary_sensor.solar_production') == 'on' %}
            script.energy_enable_heavy_consumption
          {% else %}
            script.energy_disable_heavy_consumption
          {% endif %}

script:
  energy_enable_heavy_consumption:
    alias: 'Energy - Enable Heavy Consumption'
    sequence:
      - alias: 'Debug notification'
        action: notify.notify
        data:
          message: 'Solar threshold exceeded'
      - alias: 'Enable heavy consumers'
        action: switch.turn_on
        target:
          entity_id: group.energy_heavy_consumers
  energy_disable_heavy_consumption:
    alias: 'Energy - Disable Heavy Consumption'
    sequence:
      - alias: 'Debug notification'
        action: notify.notify
        data:
          message: 'Solar insufficient'
      - alias: 'Disable heavy consumers'
        action: switch.turn_off
        target:
          entity_id: switch.energy_heavy_consumers
