---
################################################################################
# Function - Security
################################################################################

# This is currently very rudimentary, but the goal is to start integrating
# additional sensors into my alarm system, and provide a better means of
# monitoring the house when we are away.
# Ideas:
# Flash some lights/make some noise when the alarm is tripped
# integrate external sensors into the alarm

################################################################################
# Inputs
################################################################################
input_datetime:
  alarm_auto_arm:
    name: 'Alarm Auto-Arm'
    icon: mdi:clock-outline
    has_date: false
    has_time: true

  alarm_auto_disarm:
    name: 'Alarm Auto-Disarm'
    icon: mdi:clock-outline
    has_date: false
    has_time: true

  alarm_weekend_disarm:
    name: 'Alarm Weekend Disarm'
    icon: mdi:clock-outline
    has_date: false
    has_time: true
    initial: '09:00:00'
################################################################################

################################################################################
# iOS Notifications
################################################################################
# ios:
#   push:
#     categories:
#       - name: Garage Door
#         identifier: 'garage_door'
#         actions:
#           - identifier: 'garage_close'
#             title: 'Close'
#             activationMode: 'background'
#             authenticationRequired: true
#             destructive: false
#             behavior: 'default'
#           - identifier: 'dismiss'
#             title: 'Dismiss'
#             activationMode: 'background'
#             authenticationRequired: true
#             destructive: true
#             behavior: 'default'
################################################################################

template:
  ################################################################################
  - sensor:
      - default_entity_id: sensor.alarm_auto_arm
        name: Alarm Auto Arm
        icon: mdi:clock-outline
        state: >
          {{ (states.input_datetime.alarm_auto_arm.attributes.timestamp |
              int | timestamp_custom("%H:%M",False)) }}
      - default_entity_id: sensor.alarm_auto_disarm
        name: Alarm Auto Disarm
        icon: mdi:clock-outline
        state: >
          {{ (states.input_datetime.alarm_auto_disarm.attributes.timestamp |
              int | timestamp_custom("%H:%M",False)) }}
      - default_entity_id: sensor.alarm_weekend_disarm
        name: Alarm Weekend Disarm
        icon: mdi:clock-outline
        state: >
          {{ (states.input_datetime.alarm_weekend_disarm.attributes.timestamp |
              int | timestamp_custom("%H:%M",False)) }}
################################################################################
automation:
  ################################################################################
  - id: function_security_alarm_state_change
    alias: 'Function - Security - Alarm State Change'
    triggers:
      - trigger: state
        entity_id: alarm_control_panel.home
    actions:
      - variables:
          color: > # red, green, blue
            {% if trigger.to_state.state == 'armed_away' %}
              0
            {% elif trigger.to_state.state in ['armed_home', 'armed_night'] %}
              85
            {% else %}
              170
            {% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.to_state.state in ['armed', 'armed_home', 'armed_away'] }}
            sequence:
              - alias: 'Lock all doors'
                action: lock.lock
                entity_id:
                  - lock.front_door_lock
                  - lock.back_door_lock
              - alias: 'Close all covers'
                action: cover.close_cover
                entity_id:
                  - cover.main_garage_door
                  - cover.second_garage_door
              - alias: 'Turn off fireplace'
                action: switch.turn_off
                target:
                  entity_id: switch.fireplace
      - alias: 'Get all switch LED indicators'
        variables:
          lights: >
            {{ states.number
                | selectattr('entity_id', 'search', '_led_indicator_color$')
                | map(attribute='entity_id')
                | list }}
      - alias: 'Cycle through all lights'
        repeat:
          for_each: >
            {{ lights }}
          sequence:
            - alias: 'Set switch indicator to color'
              action: number.set_value
              data:
                entity_id: >
                  {{ repeat.item }}
                value: >
                  {{ color }}
  ################################################################################
  # Watch the following sensors when the alarm is on to extend the system
  - id: function_security_additional_sensors
    alias: 'Function - Security - Additional Sensors'
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.garage_side_door
    conditions:
      - condition: state
        entity_id:
          - alarm_control_panel.home
        state:
          - armed
          - armed_home
          - armed_away
    actions:
      - action: alarm_control_panel.alarm_trigger
        entity_id: alarm_control_panel.home
  ################################################################################
  - id: function_security_alarm_auto_arm
    alias: 'Function - Security - Alarm Auto Arm'
    triggers:
      - trigger: template
        value_template: >
          {{ states.sensor.time.state == states.sensor.alarm_auto_arm.state }}
    conditions:
      condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.worknight
          state: 'on'
    actions:
      action: alarm_control_panel.alarm_arm_home
      data:
        entity_id: alarm_control_panel.home
        code: !secret alarm_code
  ################################################################################
  - id: function_security_alarm_auto_disarm
    alias: 'Function - Security - Alarm Auto Disarm'
    triggers:
      - trigger: template
        value_template: >
          {{ states.sensor.time.state == states.sensor.alarm_auto_disarm.state }}
    conditions:
      condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.workday
          state: 'on'
        - condition: state
          entity_id: input_boolean.away_mode
          state: 'off'
        - condition: state
          entity_id: input_boolean.vacation_mode
          state: 'off'
    actions:
      action: alarm_control_panel.alarm_disarm
      data:
        entity_id: alarm_control_panel.home
        code: !secret alarm_code
  ################################################################################
  - id: function_security_alarm_weekend_disarm
    alias: 'Function - Security - Alarm Weekend Disarm'
    description: Safety-net disarm on non-workdays when someone is home
    triggers:
      - trigger: time
        at: input_datetime.alarm_weekend_disarm
    conditions:
      - condition: state
        entity_id: binary_sensor.workday
        state: 'off'
      - condition: state
        entity_id: group.people
        state: 'home'
      - condition: state
        entity_id: alarm_control_panel.home
        state: 'armed_home'
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: 'off'
    actions:
      - action: alarm_control_panel.alarm_disarm
        data:
          entity_id: alarm_control_panel.home
          code: !secret alarm_code
    mode: single
  ################################################################################
  - id: function_security_front_porch_motion
    alias: 'Function - Security - Front Porch Motion'
    description: >
      Companion alert on UniFi front-door motion with camera still/stream and
      actionable deep links. Live view is HA more-info; two-way talk requires
      UniFi Protect (HA media_player is speaker/TTS only).
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_camera_motion
        from: 'off'
        to: 'on'
    mode: single
    actions:
      # Companion camera attachment + URI actions (notify.notify cannot do these).
      - action: notify.mobile_app_ians_iphone
        data:
          title: Motion detected at front door
          message: Who could it be?
          data:
            tag: front-porch-motion
            group: security
            push:
              interruption-level: time-sensitive
            # Still in preview; expand notification for MJPEG when supported.
            entity_id: camera.front_door
            # Tap opens camera more-info. Protect URI is the video-call path.
            url: entityId:camera.front_door
            actions:
              - action: URI
                title: View Camera
                uri: entityId:camera.front_door
              - action: URI
                title: Open Protect
                uri: unifi-protect://
      - action: notify.mobile_app_ians_ipad_pro
        data:
          title: Motion detected at front door
          message: Who could it be?
          data:
            tag: front-porch-motion
            group: security
            push:
              interruption-level: time-sensitive
            entity_id: camera.front_door
            url: entityId:camera.front_door
            actions:
              - action: URI
                title: View Camera
                uri: entityId:camera.front_door
              - action: URI
                title: Open Protect
                uri: unifi-protect://
################################################################################
