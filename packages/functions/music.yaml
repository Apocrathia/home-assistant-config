---
### Music Functions ###
template:
  - button:
      # HomeKit-exposed trigger for script.function_infinite_mix:
      # the operator's background-music mode (Infinite Mix at 50%
      # house-wide), fired by the manual button press via the main HomeKit
      # bridge (packages/integrations/homekit.yaml).
      - default_entity_id: button.play_music
        name: 'Play Music'
        icon: mdi:radio
        # Passes no data: the script plays Infinite Mix at its default 50%
        # volume; pass a `volume` field to override.
        press:
          - action: script.function_infinite_mix
      - default_entity_id: button.pause_music
        name: Pause Music
        icon: mdi:pause
        press:
          - action: media_player.media_pause
            target:
              entity_id: media_player.whole_home

script:
  ################################################################################
  function_infinite_mix:
    alias: 'Function - Music - Infinite Mix'
    description: |
      Starts Music Assistant's Infinite Mix (built-in library mix) on the
      whole-home group via Music Assistant (media_player.whole_home). No-op
      when the group is already playing. Standardizes every member to the
      target volume (default 50%), then waits for playback and retries once.
    fields:
      volume:
        description: 'Target volume (0-100) for every group member before playback.'
        example: '50'
        advanced: false
        required: false
        default: 50
        selector:
          number:
            min: 0
            max: 100
            step: 1
            unit_of_measurement: '%'
    variables:
      # Pinned source: Music Assistant's built-in "Infinite Mix" playlist
      # (builtin provider, dynamic playlist; media_type stays playlist).
      # The provider URI is the exact media_id for music_assistant.play_media
      # (verify_item_uri returns True - resolve live before trusting).
      mix_uri: 'builtin://playlist/infinite_mix'
      # Field default is UI-only on HA 2026.9.2, so the runtime fallback lives
      # here: 50% house-wide (operator 2026-11).
      target_volume: >
        {{ (volume | default(50) | int) / 100 }}
    sequence:
      - alias: 'Do nothing if music is already playing'
        if:
          - condition: state
            entity_id: media_player.whole_home
            state: playing
        then:
          - stop: 'Music is already playing'
      - alias: 'Standardize every group member volume'
        repeat:
          for_each: '{{ state_attr("media_player.whole_home", "group_members") }}'
          sequence:
            - action: media_player.volume_set
              target:
                entity_id: '{{ repeat.item }}'
              data:
                volume_level: '{{ target_volume }}'
      - alias: 'Play Infinite Mix on the whole-home group'
        action: music_assistant.play_media
        target:
          entity_id: media_player.whole_home
        data:
          media_type: playlist
          media_id: '{{ mix_uri }}'
          enqueue: replace
      # AirPlay has a known no-start mode; music-side entities report
      # properly, so waiting on state is valid (same as the wakeup script).
      - alias: 'Wait for the group to start playing'
        wait_for_trigger:
          - trigger: state
            entity_id: media_player.whole_home
            to: playing
        timeout:
          seconds: 45
      - alias: 'Retry once if playback never started'
        if:
          - condition: not
            conditions:
              - condition: state
                entity_id: media_player.whole_home
                state: playing
        then:
          - action: music_assistant.play_media
            target:
              entity_id: media_player.whole_home
            data:
              media_type: playlist
              media_id: '{{ mix_uri }}'
              enqueue: replace

automation:
  ################################################################################
  - id: function_music_away_pause
    alias: 'Function - Music - Away Pause'
    triggers:
      - trigger: state
        entity_id: input_boolean.away_mode
        to: 'on'
    actions:
      - alias: 'Pause the whole-home group'
        action: media_player.media_pause
        target:
          entity_id: media_player.whole_home
  ################################################################################
  - id: function_music_home_resume
    alias: 'Function - Music - Home Resume'
    triggers:
      - trigger: state
        entity_id: input_boolean.away_mode
        to: 'off'
    conditions:
      - condition: time
        after: '05:00:00'
        before: '22:00:00'
    actions:
      - alias: 'Play Infinite Mix at the time-of-day volume'
        action: script.function_infinite_mix
        data:
          # If it's before 0900, volume @ 50%, else 25%
          volume: '{{ 50 if now().hour < 9 else 25 }}'
  ################################################################################
  - id: function_music_group_watchdog
    alias: 'Function - Music - Group Watchdog'
    description: >
      Re-adds any speaker that dropped out of the Whole Home sync group while
      it is playing. For Music Assistant the working direction is target=group
      and group_members=[the missing player].
    triggers:
      - trigger: state
        entity_id: media_player.whole_home
        to: playing
      - trigger: time_pattern
        minutes: '/2'
    conditions:
      - condition: state
        entity_id: media_player.whole_home
        state: playing
    actions:
      - alias: 'Re-add any missing speakers'
        repeat:
          for_each: >
            {{ ['media_player.housewaves_three_93b020',
                'media_player.housewaves_three_93a06c',
                'media_player.kitchen_homepod',
                'media_player.master_bathroom_homepod',
                'media_player.bedside_left_homepod',
                'media_player.bedside_right_homepod',
                'media_player.office_homepod',
                'media_player.upstairs_homepod']
               | reject('in', state_attr('media_player.whole_home', 'group_members') | default([]))
               | list }}
          sequence:
            - action: media_player.join
              target:
                entity_id: media_player.whole_home
              data:
                group_members:
                  - '{{ repeat.item }}'
  ################################################################################
  - id: function_music_stall_watchdog
    alias: 'Function - Music - Stall Watchdog'
    description: >
      Restarts the Whole Home stream when it stalls mid-track. MA position
      updates are event-driven (track start / pause / play) with HA
      extrapolating in between, so a stale timestamp alone is normal - the
      stall signature is the extrapolated position running past the track
      duration while the state still says playing.
    triggers:
      - trigger: time_pattern
        minutes: '/5'
    conditions:
      - condition: state
        entity_id: media_player.whole_home
        state: playing
      - condition: template
        value_template: >
          {% set pos = state_attr('media_player.whole_home', 'media_position') %}
          {% set dur = state_attr('media_player.whole_home', 'media_duration') %}
          {% set upd = state_attr('media_player.whole_home', 'media_position_updated_at') %}
          {{ dur is not none and pos is not none and upd is not none
             and dur > 0
             and (pos + (now() - upd).total_seconds()) > (dur + 120) }}
    actions:
      - alias: 'Stop the stalled stream'
        action: media_player.media_stop
        target:
          entity_id: media_player.whole_home
      - delay: '00:00:03'
      - alias: 'Restart the Infinite Mix'
        action: music_assistant.play_media
        target:
          entity_id: media_player.whole_home
        data:
          media_type: playlist
          media_id: 'builtin://playlist/infinite_mix'
          enqueue: replace
