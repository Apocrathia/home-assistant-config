---
### Party Lights ###

# Inputs

input_boolean:
  party_lights:
    name: Party Lights
    icon: mdi:party-popper

automation:
  ################################################################################
  - id: party_lights
    alias: Toys - Light - Party Lights
    variables:
      entities:
        - light.front_porch_light_left
        - light.front_porch_light_right
        - light.outdoor_garage_light_left
        - light.outdoor_garage_light_right
        - light.sitting_room_floor_lamp
        - light.office_floor_lamp
    triggers:
      - trigger: state
        entity_id: input_boolean.party_lights
        to: 'on'
    actions:
      - alias: 'Chase rainbow across the lights'
        repeat:
          for_each: '{{ entities }}'
          sequence:
            - if:
                - condition: state
                  entity_id: input_boolean.party_lights
                  state: 'on'
              then:
                - action: light.turn_on
                  target:
                    entity_id: '{{ repeat.item }}'
                  data:
                    effect: rainbow
                - delay:
                    milliseconds: 500
      - alias: 'Wait until party mode ends'
        wait_template: "{{ is_state('input_boolean.party_lights', 'off') }}"
      - alias: 'Reset the lights'
        choose:
          - conditions:
              - alias: 'The sun is down'
                condition: state
                entity_id: sun.sun
                state: 'below_horizon'
            sequence:
              - alias: 'Set lights to night mode'
                action: light.turn_on
                data:
                  entity_id: >
                    {{ entities }}
                  profile: relax
        default:
          - alias: 'Turn the lights off'
            action: light.turn_off
            data:
              entity_id: >
                {{ entities }}

################################################################################
