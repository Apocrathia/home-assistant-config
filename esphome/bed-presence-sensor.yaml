---
substitutions:
  name: bed-presence-sensor
  friendly_name: Bed Presence Sensor
  room: Master Bedroom

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  area: ${room}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  project:
    name: ElevatedSensors.BedPresenceMk1
    version: DIY
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: n

logger:

api:
  encryption:
    key: !secret home_assistant_api_encryption_key

ota:
  platform: esphome
  password: !secret esphome_ota

wifi: !include common/wifi.yaml

captive_portal:

################################################################################
# Vendor package already includes diagnostics — do not also include
# common/diagnostics.yaml (would duplicate wifi/uptime/reset entities).
packages:
  remote_package:
    url: https://github.com/ElevatedSensors/sensor-configs
    ref: main
    refresh: 1s
    files:
      - bed-presence-mk1/base.yaml
      - esphome-common/bluetooth-proxy.yaml
# See https://github.com/ElevatedSensors/sensor-configs/blob/main/bed-presence-mk1/sensor.yaml for a detailed
# description of available substitutions.
#
# substitutions:
#   trigger_percentile: '0.75'
#   averaging_window_samples: '5'
#   fast_delayed_on: '0ms'
#   fast_delayed_off: '0ms'
#   standard_delayed_on: '0s'
#   standard_delayed_off: '1s'
#   slow_delayed_on: '2s'
#   slow_delayed_off: '5s'
#   reporting_delta: '1.0'
#   reporting_interval_max: '180s'
#   calibrate_100: '408000'
#   calibrate_0: '276000'
