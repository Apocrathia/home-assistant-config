---
substitutions:
  name: office_voice
  friendly_name: Office Voice
  # renovate: datasource=github-releases depName=esphome/home-assistant-voice-pe versioning=semver
  config_version: 26.9.0

<<: !include common/diagnostics.yaml

packages:
  Nabu Casa.Home Assistant Voice PE: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@${config_version}

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

wifi: !include common/wifi.yaml

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret home_assistant_api_encryption_key

ota:
  platform: esphome
  encryption:

captive_portal:
