---
<<: !include common/diagnostics.yaml

substitutions:
  name: office-desk-controller
  friendly_name: Office Desk Controller
  # renovate: datasource=github-releases depName=tjhorner/upsy-desky
  version: v5.0.1
packages:
  tj_horner.upsy_desky: github://tjhorner/upsy-desky/firmware/stock.yaml@${version}
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
wifi: !include common/wifi.yaml

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret home_assistant_api_encryption_key

ota:
  platform: esphome
  password: !secret esphome_ota

captive_portal:
