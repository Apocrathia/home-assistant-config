    id: feed_sunday
    name: 'Feed Sunday'
    icon: mdi:calendar-week
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: feed_monday
    name: 'Feed Monday'
    icon: mdi:calendar-week
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
