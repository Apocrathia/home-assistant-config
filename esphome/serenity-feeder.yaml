    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: feed_friday
    name: 'Feed Friday'
    icon: mdi:calendar-week
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: feed_saturday
    name: 'Feed Saturday'
    icon: mdi:calendar-week
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - id: enable_sensors
    internal: true
    platform: gpio
    pin:
      number: GPIO33
    restore_mode: ALWAYS_ON
    disabled_by_default: true

  - id: enable_feeder_motor
    internal: true
    platform: gpio
    pin:
      number: GPIO19
    restore_mode: ALWAYS_OFF
    disabled_by_default: true

  - id: feed_forward
    internal: true
    interlock: &interlock_group [feed_forward, feed_reverse]
    platform: gpio
    pin:
      number: GPIO18
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - switch.turn_on: enable_feeder_motor
    on_turn_off:
      then:
        - switch.turn_off: enable_feeder_motor

  - id: feed_reverse
    internal: true
    interlock: *interlock_group
    platform: gpio
    pin:
      number: GPIO17
    restore_mode: ALWAYS_OFF

  - id: mute_sounds
    name: Mute sounds
    icon: mdi:volume-off
    optimistic: true
    platform: template

sensor:
  - platform: wifi_signal
    name: 'Signal'
    update_interval: 60s
  - platform: template
    id: dispensed_food_quantity
    name: 'Dispensed food quantity'
    icon: mdi:cup
    entity_category: diagnostic
    state_class: 'measurement'
    accuracy_decimals: 0
    lambda: |-
      return id(last_food_sensor_count);
  - platform: template
    id: dispensed_food_scoops
    name: 'Dispensed food scoops'
    icon: mdi:cup
    entity_category: diagnostic
    state_class: 'measurement'
    accuracy_decimals: 0
    lambda: |-
      return id(last_food_scoops_count) / ${pulses_per_scoop};
  - platform: template
    id: total_dispensed
    name: 'Total dispensed scoops'
    icon: mdi:counter
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      return id(total_dispensed_scoops) / ${pulses_per_scoop};

button:
  - platform: template
    name: 'Reset dispense counter'
    id: reset_dispense_counter
    icon: mdi:counter-reset
    entity_category: config
    on_press:
      then:
        - lambda: id(total_dispensed_scoops) = 0;
  - name: 'Dispense food'
    id: dispense_food
    icon: mdi:food-turkey
    platform: template
    on_press:
      - lambda: id(actuate_feeder)->execute((int) id(default_scoops).state);
  - name: 'Stop feed'
    id: stop_feed
    icon: mdi:stop-circle
    platform: template
    on_press:
      - switch.turn_off: feed_forward
  - platform: restart
    name: 'Restart'
    disabled_by_default: true
