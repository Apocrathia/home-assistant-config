# Serenity Feeder - Petkit Fresh Element Solo (P570) on the stock ESP32-WROOM-32D.
#
# Vendored + adapted from the pinned community config v1.1 by n6ham:
#   https://github.com/n6ham/esphome-configs/blob/master/petkit-fresh-element-solo.yaml
#   repo commit 3334797ae5e228e6e3efaa4c76e849516c65601c (2026-01-12)
#   https://devices.esphome.io/devices/petkit-fresh-element-solo-pet-feeder/
#
# House adaptations vs upstream v1.1 (full list in .scratch/petkit-feeder/draft-notes.md):
#   - house skeleton: substitutions/esphome/wifi/logger/api/ota/captive_portal blocks
#     replace upstream wifi/api/ota/captive_portal/dashboard_import/web_server blocks
#   - name_add_mac_suffix: false; upstream project tag dropped; comment tag kept
#   - jam guard added (handle_food_jam + the 1 s watchdog interval; event
#     esphome.feeder_food_jam); no auto-reverse (upstream never reverses either)
#   - lint normalization only elsewhere (lowercase booleans, bracket spacing,
#     wrapped lines, stripped trailing spaces) - no behavior change
---
substitutions:
  name: serenity-feeder
  friendly_name: Serenity Feeder
  device_description: "Serenity's Petkit Fresh Element Solo smart pet feeder"
  default_scoops: '1'
  min_scoops: '0'
  max_scoops: '6'
  # Motor pulses (GPIO27) must arrive at least this often while feeding, else jam.
  jam_timeout_ms: '3000'

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  comment: ${device_description}
  on_boot:
    - light.turn_on:
        id: led
        effect: fast_blink

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi: !include common/wifi.yaml

logger:
  level: INFO
  # baud_rate 0 frees GPIO1/GPIO3 (UART0) for the uart component below (upstream design).
  baud_rate: 0

api:
  encryption:
    key: !secret home_assistant_api_encryption_key

ota:
  platform: esphome
  password: !secret esphome_ota

captive_portal:

# common/diagnostics.yaml deliberately NOT included (bed-presence-sensor trap):
# this config ships upstream's own wifi_signal sensor ("Signal"), its own Restart
# button, and its own sntp time; the include would add a second wifi-signal
# sensor plus a redundant homeassistant time component.

globals:
  - id: scoops_count
    type: int
  - id: max_scoops
    type: int
  - id: food_sensor_count
    type: int
  - id: last_food_sensor_count
    type: int
    initial_value: '0'
    restore_value: true
  - id: last_food_scoops_count
    type: int
    initial_value: '0'
    restore_value: true
  # Jam guard: millis() timestamp of the last motor pulse seen on GPIO27.
  - id: last_motor_pulse_ms
    type: int
    initial_value: '0'
    restore_value: false

script:
  - id: play_rtttl
    parameters:
      song_str: string
    then:
      - if:
          condition:
            lambda: return !(id(mute_sounds).state);
          then:
            - rtttl.play:
                rtttl: !lambda 'return song_str;'
  - id: actuate_feeder
    parameters:
      scoops: int
    then:
      - if:
          condition:
            lambda: return scoops > 0;
          then:
            - logger.log:
                level: INFO
                format: 'Serving %d scoops'
                args: [scoops]
            - lambda: |-
                id(play_rtttl)->execute("two_shorts:d=4,o=5,b=100:16e6,16e6");
                id(scoops_count) = 0;
                id(food_sensor_count) = 0;
                id(max_scoops) = scoops;
                id(last_motor_pulse_ms) = millis();
            - switch.turn_on: feed_forward
  - id: dispatch_feeder_food_dispensed_event
    parameters:
      event_message: string
    then:
      - homeassistant.event:
          event: esphome.feeder_food_dispensed
          data:
            message: !lambda return event_message;
  - id: dispatch_feeder_food_low_event
    parameters:
      event_message: string
    then:
      - homeassistant.event:
          event: esphome.feeder_food_low
          data:
            message: !lambda return event_message;
  - id: check_food_level
    parameters:
      food_dispensed: bool
      play_sound: bool
      send_event: bool
    then:
      lambda: |-
        if (id(last_food_scoops_count) > 0 &&
            id(last_food_sensor_count) / id(last_food_scoops_count) <
                id(low_food_threshold).state) {
          if (play_sound) {
            id(play_rtttl)->execute("siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e");
          }
          if (send_event) {
            id(dispatch_feeder_food_low_event)->execute(
              "${friendly_name} food level is low. Check the hopper."
            );
          }
          id(feeder_state).publish_state("Food level is low");
          ESP_LOGI("main", "Food level is low");
        } else if (food_dispensed) {
          id(feeder_state).publish_state("Food dispensed");
          id(play_rtttl)->execute("one_short:d=4,o=5,b=100:16e6");
          if (id(last_food_scoops_count) == 1) {
            id(dispatch_feeder_food_dispensed_event)->execute("${friendly_name} dispensed 1 scoop of food.");
          } else {
            id(dispatch_feeder_food_dispensed_event)->execute(
              "${friendly_name} dispensed " + to_string(id(scoops_count)) + " scoops of food."
            );
          }
        }
  # House addition - jam handler. Stops the motor first, then logs, fires the
  # esphome.feeder_food_jam HA event, and updates the state text sensor.
  # No auto-reverse: upstream's normal flow never runs feed_reverse either.
  - id: handle_food_jam
    then:
      - switch.turn_off: feed_forward
      - logger.log:
          level: WARN
          format: 'Food jam: no motor pulses for over ${jam_timeout_ms} ms, feed stopped'
      - homeassistant.event:
          event: esphome.feeder_food_jam
          data:
            message: '${friendly_name} food jam detected. Motor stopped. Check the feeder.'
      - lambda: id(feeder_state).publish_state("Food jam detected");

light:
  - platform: binary
    id: led
    output: led_output
    effects:
      - strobe:
          name: fast_blink
          colors:
            - state: true
              duration: 125ms
            - state: false
              duration: 125ms
    internal: true

output:
  - id: led_output
    platform: gpio
    pin: GPIO5
  - platform: ledc
    pin: GPIO16
    id: rtttl_output

rtttl:
  output: rtttl_output

interval:
  - interval: 1s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on:
                id: led
                effect: None
          else:
            - light.turn_on:
                id: led
                effect: fast_blink
  # House addition - jam watchdog: while feed_forward is on, motor pulses
  # (GPIO27) must keep arriving; a stall longer than jam_timeout_ms trips the
  # jam handler. Watchdog is idle whenever the motor is off, so no boot-time
  # false positives (last_motor_pulse_ms starts at 0, feed_forward starts off).
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(feed_forward).state &&
                  (millis() - id(last_motor_pulse_ms)) > ${jam_timeout_ms};
          then:
            - script.execute: handle_food_jam

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

